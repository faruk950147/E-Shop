{% extends "admin/base.html" %}
{% load i18n %}

{% block userlinks %}
    {# Language Switcher Form #}
    <form action="{% url 'set_language' %}" method="post" style="display: inline-block; margin-right: 15px;">
        {% csrf_token %}
        <input name="next" type="hidden" value="{{ request.get_full_path }}">
        <select name="language" onchange="this.form.submit()" style="padding: 2px 5px; border-radius: 4px; background: #fff; color: #333; border: 1px solid #ccc; cursor: pointer;">
            {% get_current_language as LANGUAGE_CODE %}
            {% get_available_languages as LANGUAGES %}
            {% get_language_info_list for LANGUAGES as languages %}
            {% for language in languages %}
                <option value="{{ language.code }}"{% if language.code == LANGUAGE_CODE %} selected{% endif %}>
                    {{ language.name_local }} ({{ language.code }})
                </option>
            {% endfor %}
        </select>
    </form>
    
    {{ block.super }}
{% endblock %}
